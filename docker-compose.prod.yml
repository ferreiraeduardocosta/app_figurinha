# Produção simples num servidor próprio (VPS): banco + API.
# Uso: crie um arquivo .env.producao (ver docs/PUBLICACAO.md) e rode
#   docker compose -f docker-compose.prod.yml --env-file .env.producao up -d --build
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: 3000
      TRUST_PROXY: ${TRUST_PROXY:-1}
      REVENUECAT_WEBHOOK_TOKEN: ${REVENUECAT_WEBHOOK_TOKEN:-}
      LIGA_SEMENTE: ${LIGA_SEMENTE:-}
    ports:
      - "3000:3000"

volumes:
  dados-postgres:
