# Blueprint do Render (render.com): cria a API e o banco PostgreSQL de uma vez.
# No painel do Render: New > Blueprint > escolher este repositório e o branch.
# Passo a passo completo em docs/PUBLICACAO.md.
services:
  - type: web
    name: craques-da-varzea-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # "free" dorme após 15 min sem acesso (o 1º pedido depois leva ~1 min).
    # Para jogadores de verdade, troque por "starter".
    plan: free
    # O Render não tem região no Brasil; Virgínia (EUA) é a mais próxima.
    region: virginia
    healthCheckPath: /saude
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: craques-da-varzea-db
          property: connectionString
      - key: TRUST_PROXY
        value: "1"
      - key: LIGA_SEMENTE
        generateValue: true

databases:
  - name: craques-da-varzea-db
    databaseName: craques_varzea
    user: liga
    postgresMajorVersion: "16"
    # "free" é apagado 30 dias após a criação. Antes de convidar jogadores,
    # troque por um plano pago (ex.: "basic-256mb") no painel do banco.
    plan: free
    region: virginia
    ipAllowList: []
